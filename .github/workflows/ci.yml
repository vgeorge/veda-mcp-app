name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips `prepare` (a full build); patch-package runs explicitly.
      - run: npm ci --ignore-scripts
      - run: npx patch-package
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
